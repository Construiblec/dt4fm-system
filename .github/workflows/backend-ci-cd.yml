name: Backend CI/CD - Render

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy NestJS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' 
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Construir la aplicación
        run: npm run build

      - name: Disparar Webhook de Despliegue en Render (Producción)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK no está configurado en GitHub Secrets."
            exit 1
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK"
          echo "Despliegue de producción disparado exitosamente en Render."

      - name: Disparar Webhook de Despliegue en Render (Staging)
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_STAGING" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_STAGING no está configurado en GitHub Secrets."
            exit 1
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_STAGING"
          echo "Despliegue de staging disparado exitosamente en Render."
