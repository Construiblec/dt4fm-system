openapi: 3.1.0
info:
  title: ConstruibleC IoT API
  version: v1
  description: Local integration API; not authorized for public exposure.
paths:
  /v1/livez:
    get:
      summary: Report process liveness
      description: >-
        Unauthenticated on purpose, for systemd and local monitoring. Says
        nothing about buildings or devices; /v1/health carries that and is
        protected because it does.
      operationId: getLivez
      responses:
        "200":
          description: The local API process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
            X-Frame-Options:
              $ref: "#/components/headers/X-Frame-Options"
            Referrer-Policy:
              $ref: "#/components/headers/Referrer-Policy"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, version, environment]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: construiblec-iot-api
                  version:
                    type: string
                    const: v1
                  environment:
                    type: string
                    const: integration
  /v1/health:
    get:
      summary: Report per-building status
      description: >-
        The screen to watch daily. A building out of contact produces no
        visible errors: its doors keep opening with what was already
        synchronised, while new credentials and revocations silently stop being
        applied. An unreachable gateway is therefore reported, never raised.


        Requires a Cloudflare Access assertion from the backend service token
        or from an authorised operator.
      operationId: getHealth
      responses:
        "200":
          description: Status of every building in the registry.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
            X-Frame-Options:
              $ref: "#/components/headers/X-Frame-Options"
            Referrer-Policy:
              $ref: "#/components/headers/Referrer-Policy"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [buildings]
                properties:
                  buildings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BuildingStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
  /v1/buildings:
    get:
      summary: List the buildings that receive credentials
      description: >-
        The coverage catalogue. A building absent from this list receives no
        credentials, and no error, so adding hardware to a new building is an
        IoT operation the backend finds out about by itself. The backend reads
        it before issuing and caches it for ten minutes.
      operationId: getBuildings
      responses:
        "200":
          description: Every covered building.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Building"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices:
    get:
      summary: List the hardware of every building
      description: >-
        A building whose gateway cannot be reached contributes nothing here,
        which looks exactly like a building with no hardware. /v1/health is
        where that difference shows.


        Each gateway reads its own terminals through its local adapter. A
        terminal that is down is listed with online false and an errorCode,
        never left out.
      operationId: getDevices
      responses:
        "200":
          description: Every device the gateways reported.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices/{deviceId}/inventory:
    get:
      summary: One page of the users on one terminal
      description: >-
        Read by the backend's nightly reconciliation, which pages until
        nextCursor is null. Only the backend service token: it lists names.


        Never carries a PIN, even if a gateway forgets to drop the one ISAPI
        returns. `managed` is recomputed rather than trusted, and only an
        employeeNo that is exactly `DT4[GTE][0-9A-F]{8}` counts: it is what
        keeps the reconciliation away from residents loaded by hand. An
        unmanaged record travels with its number only.


        Every failure is an error the backend retries, never a short page: the
        reconciliation deletes managed records it does not recognise, so a
        silently incomplete page would revoke credentials that are fine.
      operationId: getInventory
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9][A-Z0-9-]{0,63}$"
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque. Pass back exactly what the previous page returned in
            nextCursor.
          schema:
            type: string
            maxLength: 1024
      responses:
        "200":
          description: One page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Every gateway answered and none owns this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            A gateway or the terminal could not be consulted. Retry; the owner
            may be the one that did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/devices/{deviceId}/trigger:
    post:
      summary: Envía un pulso idempotente a una barrera vehicular
      description: >-
        Solo admite el service token del backend. Localiza el gateway dueño y
        reenvía una vez el mismo requestId, sin aliases ni retry interno. La
        API central preselecciona kind=barrier y scope=vehicular; el gateway
        aplica la autorización definitiva desde su configuración local,
        incluido doorId=1, antes del transporte al dispositivo.

        triggered confirma el pulso, pero no afirma una posición física. Un
        resultado ambiguous significa que el pulso pudo ocurrir y no debe
        reintentarse automáticamente. Un retry técnico decidido por Sistemas
        reutiliza el mismo requestId; un nuevo clic genera otro UUID.
      operationId: triggerVehicleBarrier
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9][A-Z0-9-]{0,63}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRequest"
      responses:
        "200":
          description: Resultado final triggered o resultado ambiguous.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResult"
        "400":
          $ref: "#/components/responses/TriggerNotSent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TriggerNotSent"
        "500":
          $ref: "#/components/responses/TriggerNotSent"
        "502":
          $ref: "#/components/responses/TriggerNotSent"
        "503":
          $ref: "#/components/responses/TriggerNotSent"
  /v1/credentials/{credentialId}:
    parameters:
      - name: credentialId
        in: path
        required: true
        description: >-
          Proposed by the backend as a UUID. The employeeNo written to each
          terminal is derived from it, which is what makes a resent PUT land
          on the same record instead of creating a second one.
        schema:
          type: string
          format: uuid
    put:
      summary: Place or update a credential on the doors of its scope
      description: >-
        Only the backend service token. The PIN travels in this body, is
        forwarded to the gateway and dropped: it is never stored, logged or
        returned. The aggregate state is what the backend reads; `partial` is
        not an error, a guest with the PIN on the pedestrian gate but not on
        the barrier can still walk in.
      operationId: putCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequest"
      responses:
        "200":
          $ref: "#/components/responses/CredentialResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
    get:
      summary: Read a credential from the doors themselves
      description: >-
        What is on the terminals today, not what anybody remembers. The
        backend's GET carries neither the subject type nor the building, so
        every gateway is asked for the three possible employee numbers. 404
        only when every gateway answered and none has it; if one could not be
        asked, absence cannot be claimed and the answer is `unreachable`.
      operationId: getCredential
      responses:
        "200":
          $ref: "#/components/responses/CredentialResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Every gateway answered and no terminal holds it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Revoke a credential everywhere
      description: >-
        Idempotent: deleting what is already gone is success, never 404. A
        revocation that did not reach a device is reported as `partial` or
        `unreachable`, never swallowed, so the backend keeps it pending and
        sends it again. `written` means it reached every device.
      operationId: deleteCredential
      responses:
        "200":
          $ref: "#/components/responses/CredentialResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
  /v1/cameras:
    get:
      summary: Lista las cámaras que los gateways retransmiten
      description: >-
        Lectura de estado: nombres y nada más. Admite el service token del
        backend o un operador autorizado. No da video a nadie; eso lo hace una
        sesión, que solo puede pedir el backend.


        Cada gateway responde desde su registro, sin tocar el NVR. Un edificio
        cuyo gateway no responde no aporta cámaras, igual que en /v1/devices, y
        un edificio fuera del catálogo devuelve una lista vacía, sin error. La
        marca, el canal y la dirección del NVR nunca salen del edificio.
      operationId: getCameras
      parameters:
        - name: buildingId
          in: query
          required: false
          description: Building._id de openMAINT. Limita la lista a un edificio.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Las cámaras que los gateways consultados declararon.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Camera"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
  /v1/cameras/{cameraId}/live-sessions:
    post:
      summary: Emite lo que un navegador necesita para ver una cámara en vivo
      description: >-
        Solo admite el service token del backend, que ya decidió que el
        operador puede mirar y que registra que lo hizo: esta API no conoce
        operadores ni guarda quién vio qué.


        Devuelve un ticket de un solo uso, válido 60 segundos y atado a esta
        cámara, la URL WHEP donde presentarlo y las credenciales TURN de la
        sesión. No arranca nada: el video se pide al gateway cuando el
        navegador llega con su oferta. El backend entrega la respuesta al
        navegador tal cual y no la guarda.


        El requestId es el identificador del backend para esta visualización.
        Aparece en el log de esta API y es lo que une ambos registros.
      operationId: createLiveSession
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9][A-Z0-9-]{0,63}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveSessionRequest"
      responses:
        "201":
          description: Ticket y credenciales emitidos. Nada se ha conectado todavía.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Todos los gateways respondieron y ninguno tiene esta cámara.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/LiveNotIssued"
        "503":
          $ref: "#/components/responses/LiveNotIssued"
  /v1/live/{cameraId}/whep:
    parameters:
      - name: cameraId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{0,63}$"
    post:
      summary: Negocia el video de una cámara (WHEP)
      description: >-
        Lo llama el navegador del operador en el hostname de video, que no
        está detrás de Cloudflare Access. Lo que autentica es el ticket, en
        Authorization Bearer: firmado por esta API, atado a la cámara de la
        ruta, de un solo uso y caducado al minuto.


        El cuerpo es la oferta SDP y la respuesta, el SDP del relay. Por aquí
        solo pasa la negociación; el video va del relay al navegador a través
        del servicio TURN. Location nombra el recurso de la sesión, que sirve
        para enviar candidatos ICE tardíos y para cerrarla.


        Un ticket queda gastado en cuanto la oferta es aceptable, también si la
        cámara no arranca: reintentar exige pedir otra sesión al backend. La
        sesión se corta sola al cumplir maxDurationSeconds.
      operationId: negotiateLiveSession
      security:
        - liveTicket: []
      requestBody:
        required: true
        content:
          application/sdp:
            schema:
              type: string
              maxLength: 16384
      responses:
        "201":
          description: Respuesta SDP del relay.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Location:
              description: Ruta del recurso de la sesión, relativa a este hostname.
              schema:
                type: string
            ETag:
              description: Se devuelve en If-Match al enviar candidatos ICE.
              schema:
                type: string
            Accept-Patch:
              schema:
                type: string
                const: application/trickle-ice-sdpfrag
          content:
            application/sdp:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/LiveRefused"
        "403":
          $ref: "#/components/responses/LiveRefused"
        "404":
          $ref: "#/components/responses/LiveRefused"
        "502":
          $ref: "#/components/responses/LiveRefused"
        "503":
          $ref: "#/components/responses/LiveRefused"
    options:
      summary: Preflight CORS de la negociación
      description: >-
        Solo responde con cabeceras CORS a los orígenes configurados. Un origen
        ajeno recibe 403 y ninguna cabecera.
      operationId: preflightLiveSession
      responses:
        "204":
          description: El origen puede llamar.
        "403":
          $ref: "#/components/responses/LiveRefused"
  /v1/live/sessions/{sessionToken}:
    parameters:
      - name: sessionToken
        in: path
        required: true
        description: >-
          El valor de Location que devolvió la negociación. Es una capacidad
          firmada: nombra una sesión y caduca con ella.
        schema:
          type: string
    patch:
      summary: Envía candidatos ICE tardíos de una sesión
      description: >-
        Trickle ICE de WHEP. Un cliente que espera a reunir sus candidatos
        antes de ofertar nunca lo necesita.
      operationId: trickleLiveSession
      requestBody:
        required: true
        content:
          application/trickle-ice-sdpfrag:
            schema:
              type: string
              maxLength: 16384
      responses:
        "204":
          description: Candidatos entregados al relay.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/LiveRefused"
        "404":
          $ref: "#/components/responses/LiveRefused"
        "503":
          $ref: "#/components/responses/LiveRefused"
    delete:
      summary: Cierra una sesión de video
      description: >-
        Idempotente: cerrar una sesión que ya terminó no es un error. Cerrar al
        salir libera el cupo y deja de tirar del NVR; si el navegador no lo
        hace, la sesión termina igualmente al desconectarse o al cumplir su
        duración máxima.
      operationId: closeLiveSession
      responses:
        "204":
          description: La sesión ya no existe.
        "403":
          $ref: "#/components/responses/LiveRefused"
        "404":
          $ref: "#/components/responses/LiveRefused"
        "503":
          $ref: "#/components/responses/LiveRefused"
    options:
      summary: Preflight CORS del recurso de sesión
      operationId: preflightLiveResource
      responses:
        "204":
          description: El origen puede llamar.
        "403":
          $ref: "#/components/responses/LiveRefused"
  /v1/greeting:
    get:
      summary: Return a static welcome message
      description: >-
        Carries no state and no caller data. It exists to exercise the request
        path end to end without touching a protected resource.
      operationId: getGreeting
      responses:
        "200":
          description: The welcome message.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
            X-Frame-Options:
              $ref: "#/components/headers/X-Frame-Options"
            Referrer-Policy:
              $ref: "#/components/headers/Referrer-Policy"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message:
                    type: string
                    const: Hello from ConstruibleC IoT API
components:
  schemas:
    TriggerRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: >-
            UUID canónico en minúsculas. Un retry técnico reutiliza exactamente
            el mismo valor; cada clic intencional usa un UUID nuevo.
    TriggerResult:
      type: object
      additionalProperties: false
      required: [requestId, deviceId, state]
      properties:
        requestId:
          type: string
          format: uuid
        deviceId:
          type: string
        state:
          type: string
          enum: [triggered, ambiguous]
          description: >-
            triggered confirma el pulso, no la posición de la barrera.
            ambiguous conserva que el pulso pudo ocurrir y prohíbe asumir éxito
            o repetir automáticamente.
    InventoryPage:
      type: object
      additionalProperties: false
      required: [deviceId, users, nextCursor]
      properties:
        deviceId:
          type: string
          description: >-
            The requested device identifier validated against the gateway response.
        users:
          type: array
          items:
            $ref: "#/components/schemas/InventoryUser"
        nextCursor:
          type: [string, "null"]
          description: Null when this was the last page.
    InventoryUser:
      type: object
      additionalProperties: false
      required: [employeeNo, managed]
      properties:
        employeeNo:
          type: string
        managed:
          type: boolean
          description: >-
            True only when employeeNo is exactly DT4, G, T or E and eight
            uppercase hex digits, whatever the gateway said. A prefix alone
            (`DT4FM01`) or another case (`dt4g688b2fcb`) is not managed.
        name:
          type: [string, "null"]
          description: Managed records only.
        validFrom:
          type: [string, "null"]
          format: date-time
          description: >-
            Managed records only. Null when the terminal's mark had no offset;
            the reconciliation then reissues the PUT, which is idempotent.
        validTo:
          type: [string, "null"]
          format: date-time
    CredentialRequest:
      type: object
      required: [buildingId, scope, subjectType, pin, validFrom, validTo, displayName]
      properties:
        buildingId:
          type: integer
          description: Building._id from openMAINT. Must be in /v1/buildings.
        scope:
          type: string
          enum: [pedestrian, vehicular, both]
          description: >-
            `both` means every kind of door the building actually has. Asking
            for one the building lacks is refused, because a PIN that reaches
            no door is not written.
        subjectType:
          type: string
          enum: [guest, tenant, employee]
          description: >-
            Decides the letter after DT4 in the employeeNo: DT4G…, DT4T… or
            DT4E…, followed by eight uppercase hex digits of SHA-256 over the
            credentialId.
        pin:
          type: string
          pattern: "^[0-9]{4}$"
          description: Forwarded and dropped. Never stored, logged or returned.
        validFrom:
          type: string
          format: date-time
          description: ISO 8601 with an explicit offset. A naive time is refused.
        validTo:
          type: string
          format: date-time
          description: ISO 8601 with an explicit offset, after validFrom.
        displayName:
          type: string
          maxLength: 128
        unitId:
          type: [integer, "null"]
          description: Context only. Access never depends on it.
    CredentialDevice:
      type: object
      required: [deviceId, state]
      properties:
        deviceId:
          type: string
        state:
          type: string
          enum: [written, failed, unreachable, deleted]
        employeeNo:
          type: string
          pattern: "^DT4[GTE][0-9A-F]{8}$"
          description: >-
            Present on every `written` entry, exactly as written on the
            terminal. The backend stores it and reconciles against the terminal
            inventory with it by exact equality.
        at:
          type: [string, "null"]
          format: date-time
        validFrom:
          type: [string, "null"]
          format: date-time
        validTo:
          type: [string, "null"]
          format: date-time
        errorCode:
          type: string
          description: Present on every `failed` and `unreachable` entry.
    CredentialResultBody:
      type: object
      additionalProperties: false
      required: [credentialId, state, devices]
      properties:
        credentialId:
          type: string
          format: uuid
        state:
          type: string
          enum: [written, partial, unreachable, failed]
          description: >-
            written settles the credential; partial and unreachable leave it
            pending for the backend's sweep; failed makes it read errorCode.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/CredentialDevice"
        errorCode:
          type: string
          description: >-
            The code that changes what the backend does: pin_conflict means
            regenerate the PIN, device_full means alert. Present on failed,
            and on partial when a device failed. Two codes are this service's
            own: gateway_rejected, a bug on this side that retrying will not
            fix, and no_devices_in_scope, a gateway reporting no door where the
            registry says there is one.
          enum:
            - pin_conflict
            - device_full
            - device_unauthorized
            - device_unreachable
            - gateway_unreachable
            - gateway_rejected
            - no_devices_in_scope
    Building:
      type: object
      additionalProperties: false
      required: [buildingId, code, name, online, scopes, lastSeenAt]
      properties:
        buildingId:
          type: integer
          description: Building._id from openMAINT. The key the backend addresses.
        code:
          type: string
          description: Readable label. Never used as a key.
        name:
          type: string
        online:
          type: boolean
          description: Whether its gateway answered just now.
        scopes:
          type: array
          description: >-
            Which kinds of door the building has. The backend uses it to decide
            whether a vehicular credential can be placed here at all.
          items:
            type: string
            enum: [pedestrian, vehicular]
        lastSeenAt:
          type: [string, "null"]
          format: date-time
          description: Null while the gateway is unreachable.
    Device:
      type: object
      description: >-
        The central API adds buildingId; every other field is what the gateway
        read from the terminal itself. A device that cannot be reached is
        reported with online false and an errorCode, never omitted.
      properties:
        deviceId:
          type: string
        buildingId:
          type: integer
        kind:
          type: string
        scope:
          type: string
          enum: [pedestrian, vehicular]
        online:
          type: boolean
        usersUsed:
          type: integer
          description: >-
            Matters more than it looks: guests rotate, and if expired records
            are not deleted the terminal fills up and stops accepting new ones.
        usersCapacity:
          type: integer
        firmware:
          type: string
        clockSkewSeconds:
          type: integer
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        errorCode:
          type: string
          description: Present only when the terminal could not be read.
          enum:
            - device_unreachable
            - device_unauthorized
            - device_credential_absent
    Camera:
      type: object
      additionalProperties: false
      required: [cameraId, name, buildingId]
      properties:
        cameraId:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{0,63}$"
          description: Lo elige el gateway y es estable. Único entre edificios.
        name:
          type: string
          maxLength: 128
          description: Etiqueta legible para el operador.
        buildingId:
          type: integer
          description: Building._id de openMAINT. Lo añade la API central.
    LiveSessionRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: >-
            UUID canónico en minúsculas con el que el backend registra esta
            visualización. Cada clic del operador usa uno nuevo.
    LiveSession:
      type: object
      additionalProperties: false
      required:
        [requestId, cameraId, buildingId, whepUrl, ticket, ticketExpiresAt,
         maxDurationSeconds, iceServers, iceTransportPolicy]
      properties:
        requestId:
          type: string
          format: uuid
        cameraId:
          type: string
        buildingId:
          type: integer
        whepUrl:
          type: string
          format: uri
          description: Donde el navegador envía su oferta SDP con el ticket.
        ticket:
          type: string
          description: >-
            Opaco. Va en Authorization Bearer hacia whepUrl. Un solo uso, una
            sola cámara. No se guarda ni se registra.
        ticketExpiresAt:
          type: string
          format: date-time
        maxDurationSeconds:
          type: integer
          description: >-
            La sesión se corta al cumplirlos. Para seguir mirando se pide otra.
        iceServers:
          type: array
          description: >-
            Se pasan tal cual a RTCPeerConnection. Solo servidores TURN, con una
            credencial propia de esta sesión que caduca poco después de ella.
          items:
            type: object
            additionalProperties: false
            required: [urls, username, credential]
            properties:
              urls:
                type: array
                items:
                  type: string
              username:
                type: string
              credential:
                type: string
        iceTransportPolicy:
          type: string
          const: relay
          description: >-
            Obligatorio en el navegador. El relay no acepta conexiones directas
            desde internet: sin esta política la sesión no conecta.
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable code. The backend distinguishes retrying from regenerating
            from alerting by this value, so it is never free text.
        message:
          type: string
          description: Sanitised. Never a path, a trace or caller data.
    BuildingStatus:
      type: object
      additionalProperties: false
      required:
        [buildingId, code, name, siteId, gatewayOnline, gatewayLastSeenAt,
         gatewayVersion, operationsEnabled, pendingJobs, failedJobs,
         maxClockSkewSeconds, devices]
      properties:
        buildingId:
          type: integer
          description: Building._id from openMAINT. The key the backend addresses.
        code:
          type: string
          description: Readable three-letter label. Never used as a key.
        name:
          type: string
        siteId:
          type: string
          description: How the gateway knows itself; must match its IOT_GATEWAY_SITE_ID.
        gatewayOnline:
          type: boolean
        gatewayLastSeenAt:
          type: [string, "null"]
          format: date-time
          description: When the gateway last answered. Null while it is unreachable.
        gatewayVersion:
          type: [string, "null"]
          description: >-
            The gateway's contract version. It is not yet the agent version:
            the gateway reports no build identifier of its own.
        operationsEnabled:
          type: boolean
          description: >-
            Whether the gateway accepts operations. False everywhere until the
            §10 criteria are met; false too when the gateway is unreachable.
        pendingJobs:
          type: integer
          description: >-
            Always zero: no job queue exists yet. Kept because the backend was
            written against this shape.
        failedJobs:
          type: integer
          description: Always zero, for the same reason as pendingJobs.
        maxClockSkewSeconds:
          type: [integer, "null"]
          minimum: 0
          description: >-
            The largest clock drift among the building's terminals, in seconds
            and without sign: ahead and behind are equally wrong. Null when no
            terminal reported one, including when the gateway is unreachable.
        devices:
          type: array
          description: >-
            The LAN behind the tunnel, as the gateway read it from each
            terminal. A terminal that is down is listed with online false and
            an errorCode, so a building with its gateway up and its terminals
            down can be told apart. Empty when the list could not be read;
            errorCode or devicesErrorCode then says why.
          items:
            $ref: "#/components/schemas/Device"
        devicesErrorCode:
          type: string
          description: >-
            Present only when the gateway answered its health but its device
            list could not be read. Absent when errorCode is set, which
            already explains the empty list.
          enum: [gateway_unreachable, gateway_invalid_response, gateway_credential_absent]
        errorCode:
          type: string
          description: Present only when the gateway could not be consulted.
          enum: [gateway_unreachable, gateway_invalid_response]
  responses:
    LiveNotIssued:
      description: >-
        No se emitió ninguna sesión. device_ambiguous (500): más de un edificio
        declara la cámara. gateway_unreachable (503): no se pudo saber de quién
        es. live_capacity_reached (503): todas las sesiones están en uso.
        live_unavailable (503): el video en vivo no está configurado, o el
        relay o el servicio TURN no respondieron.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LiveRefused:
      description: >-
        La negociación no produjo video. unauthorized: ticket ausente, ajeno,
        caducado o ya usado (401), u origen no permitido (403); el cuerpo no
        dice cuál. not_found (404): la sesión o su edificio ya no existen.
        camera_unreachable (502): el gateway no entregó el video de la cámara.
        live_capacity_reached o live_unavailable (503). Salvo not_found al
        cerrar, todos exigen pedir otra sesión al backend.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TriggerNotSent:
      description: >-
        No se confirmó un pulso. El código distingue invalid_request,
        not_found, operations_disabled, device_not_compatible,
        device_unreachable, gateway_unreachable, gateway_rejected o
        device_ambiguous. Los resultados donde el pulso pudo ocurrir se
        devuelven como 200 con state=ambiguous, no mediante esta respuesta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CredentialResult:
      description: >-
        The outcome, per device and aggregated. Failures of the doors travel
        here with a 200; a non-2xx means the request itself was refused.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CredentialResultBody"
    InvalidRequest:
      description: >-
        The request cannot be accepted. The message names the field and never
        quotes the value, because the value may be the PIN. Not retried.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >-
        The caller may not proceed. The body never says whether the assertion
        was absent, invalid or merely not permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    liveTicket:
      type: http
      scheme: bearer
      description: >-
        El ticket que devuelve POST /v1/cameras/{cameraId}/live-sessions. No es
        una credencial de Cloudflare Access: es lo único que autentica al
        navegador en el hostname de video.
  headers:
    X-Request-ID:
      description: Valid client request ID or a newly generated UUID.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[A-Za-z0-9_.-]{1,100}$
    Cache-Control:
      schema:
        type: string
        const: no-store
    X-Content-Type-Options:
      schema:
        type: string
        const: nosniff
    X-Frame-Options:
      schema:
        type: string
        const: DENY
    Referrer-Policy:
      schema:
        type: string
        const: no-referrer
