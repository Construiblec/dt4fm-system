<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coordinador de limpiezas</title>
<meta name="description" content="Prototipo navegable del rol Coordinador de limpiezas de DT4FM, con datos de ejemplo y sin conexión a openMAINT ni a Hostaway.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  /*
   * Réplica de modulo-incidentes: tema claro único (la app declara color-scheme
   * light), fuente del sistema, brand #2563EB y la paleta de statusPalette.ts.
   * Lo único propio del prototipo son las anotaciones y su panel oscuro.
   */
  :root {
    --page: #f3f4f6;
    --ink: #0f172a;
    --ann-existe: #059669;
    --ann-ajuste: #d97706;
    --ann-propuesta: #c026d3;
    --ann-ui: #64748b;
    --ann-supuesto: #0284c7;
    --tooltip-bg: #0f172a;
    --tooltip-fg: #f8fafc;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    margin: 0;
  }

  .ann {
    position: relative;
    outline: 2px dashed var(--ann-color);
    outline-offset: 3px;
    border-radius: 12px;
  }
  .ann-existe { --ann-color: var(--ann-existe); }
  .ann-ajuste { --ann-color: var(--ann-ajuste); }
  .ann-propuesta { --ann-color: var(--ann-propuesta); }
  .ann-ui { --ann-color: var(--ann-ui); }
  .ann-supuesto { --ann-color: var(--ann-supuesto); }

  .ann-label {
    position: absolute;
    top: -10px;
    right: 10px;
    z-index: 15;
    padding: 0 7px;
    border-radius: 999px;
    background: var(--ann-color);
    color: #fff;
    font: 600 10px/17px var(--font-mono);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: help;
  }
  span.ann > .ann-label {
    top: -13px;
    right: -8px;
  }
  .ann-label::after {
    content: attr(data-note);
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 90;
    width: max-content;
    max-width: min(340px, 80vw);
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--tooltip-bg);
    color: var(--tooltip-fg);
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.28);
    font: 500 12px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0;
    text-transform: none;
    white-space: normal;
  }
  .ann-label[data-note=""]::after {
    content: none;
  }
  .ann-label:hover::after,
  .ann-label:focus::after {
    display: block;
  }
  .ann-label:focus {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  #cargando {
    display: grid;
    min-height: 100vh;
    place-items: center;
    padding-inline: 16px;
    font: 500 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #475569;
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: "#2563EB", hover: "#1D4ED8" },
        },
        fontFamily: {
          mono: ['"JetBrains Mono"', "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"],
        },
      },
    },
  };
</script>
</head>
<body>
<div id="app">
  <p id="cargando">Cargando el prototipo del Coordinador de limpiezas…</p>
</div>
<noscript>
  <p style="padding: 16px; font-family: system-ui, sans-serif">Este prototipo necesita JavaScript.</p>
</noscript>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<script src="js/domain.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens/ficha-limpieza.js"></script>
<script src="js/screens/panel.js"></script>
<script src="js/screens/sincronizacion.js"></script>
<script src="js/screens/pendientes.js"></script>
<script src="js/screens/limpiezas.js"></script>
<script src="js/screens/nueva.js"></script>
<script src="js/screens/checklists.js"></script>
<script src="js/app.js"></script>
</body>
</html>
